<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PRNT01 Status</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
    }

    .printer-card {
      max-width: 620px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .status {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .message {
      margin-top: 0;
      color: #555;
      font-size: 14px;
    }

    .event {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      background: #eee;
    }

    .event.success {
      background: #e9f7ef;
      color: #237a43;
    }

    .event.error {
      background: #fdecea;
      color: #b42318;
    }

    .event.info {
      background: #eef4ff;
      color: #315b9a;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0;
    }

    .resource-info {
      text-align: right;
    }

    .level {
      font-size: 12px;
      font-weight: bold;
      margin-top: 3px;
    }

    .normal {
      color: green;
    }

    .notice {
      color: #c28a00;
    }

    .low {
      color: #d96b00;
    }

    .very-low {
      color: #d9534f;
    }

    .empty {
      color: #b00020;
    }

    .queue-section {
      margin-top: 18px;
    }

    .queue-toggle {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f7f7f7;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .queue-panel {
      display: none;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      max-height: 220px;
      overflow-y: auto;
      padding: 8px;
    }

    .queue-panel.open {
      display: block;
    }

    .job {
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #f7f7f7;
      font-size: 14px;
    }

    .job:last-child {
      margin-bottom: 0;
    }

    .job.queued {
      border-left: 4px solid #3578e5;
    }

    .job.failed {
      border-left: 4px solid #d9534f;
    }

    .buttons {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button.action {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .green-btn {
      background: #2e8b57;
      color: white;
    }

    .red-btn {
      background: #d9534f;
      color: white;
    }

    .blue-btn {
      background: #3578e5;
      color: white;
    }

    .gray-btn {
      background: #666;
      color: white;
    }
  </style>
</head>

<body>

  <div class="printer-card">

    <h1>PRNT01</h1>

    <p id="status" class="status">
      Loading...
    </p>

    <p id="message" class="message">
      Checking printer...
    </p>

    <hr>

    <div class="row">
      <span>IP Address</span>
      <span>10.10.10.21</span>
    </div>

    <div class="row">
      <span>Paper</span>

      <div class="resource-info">
        <div id="paper">--</div>
        <div id="paperLevel" class="level">
          --
        </div>
      </div>
    </div>

    <div class="row">
      <span>Toner</span>

      <div class="resource-info">
        <div id="toner">--</div>
        <div id="tonerLevel" class="level">
          --
        </div>
      </div>
    </div>

    <div class="row">
      <span>Print Queue</span>
      <span id="queue">--</span>
    </div>

    <div id="event" class="event info">
      Waiting for activity...
    </div>

    <div class="queue-section">

      <button
        class="queue-toggle"
        onclick="toggleQueue()">

        <span id="queueTitle">
          Queued Jobs (0)
        </span>

        <span id="queueArrow">
          ▼
        </span>

      </button>

      <div
        id="queuePanel"
        class="queue-panel">

        <div id="jobList">
          No jobs queued.
        </div>

      </div>

    </div>

    <div class="buttons">

      <button
        class="action red-btn"
        onclick="runAction('/status/offline')">
        Set Offline
      </button>

      <button
        class="action green-btn"
        onclick="runAction('/status/ready')">
        Set Ready
      </button>

      <button
        class="action blue-btn"
        onclick="runAction('/queue/add')">
        Add Print Job
      </button>

      <button
        class="action blue-btn"
        onclick="runAction('/queue/complete')">
        Complete Print Job
      </button>

      <button
        class="action red-btn"
        onclick="runAction('/paper/empty')">
        Empty Paper
      </button>

      <button
        class="action green-btn"
        onclick="runAction('/paper/refill')">
        Refill Paper
      </button>

      <button
        class="action red-btn"
        onclick="runAction('/toner/empty')">
        Empty Toner
      </button>

      <button
        class="action gray-btn"
        onclick="runAction('/toner/refill')">
        Refill Toner
      </button>

    </div>

  </div>

  <script>

    function toggleQueue() {

      const panel =
        document.getElementById("queuePanel");

      const arrow =
        document.getElementById("queueArrow");

      panel.classList.toggle("open");

      if (panel.classList.contains("open")) {
        arrow.textContent = "▲";
      }
      else {
        arrow.textContent = "▼";
      }
    }


    function applyLevelStyle(element, level) {

      element.className = "level";

      if (level === "normal") {
        element.classList.add("normal");
      }
      else if (level === "notice") {
        element.classList.add("notice");
      }
      else if (level === "low") {
        element.classList.add("low");
      }
      else if (level === "very low") {
        element.classList.add("very-low");
      }
      else if (level === "empty") {
        element.classList.add("empty");
      }
    }


    function renderJobs(jobs) {

      const jobList =
        document.getElementById("jobList");

      const queueTitle =
        document.getElementById("queueTitle");

      queueTitle.textContent =
        "Queued Jobs (" + jobs.length + ")";

      if (!jobs || jobs.length === 0) {

        jobList.innerHTML =
          "<div class='job'>No jobs queued.</div>";

        return;
      }

      jobList.innerHTML = "";

      jobs.forEach(job => {

        const div =
          document.createElement("div");

        div.className =
          "job " + job.status;

        div.textContent =
          "Job #" +
          job.id +
          " — " +
          job.device +
          " — " +
          job.pages +
          " pages — " +
          job.status.toUpperCase();

        jobList.appendChild(div);
      });
    }


    function updatePage(data) {

      const statusElement =
        document.getElementById("status");

      const messageElement =
        document.getElementById("message");

      const paperLevelElement =
        document.getElementById("paperLevel");

      const tonerLevelElement =
        document.getElementById("tonerLevel");

      const eventElement =
        document.getElementById("event");


      statusElement.textContent =
        "● " + data.status.toUpperCase();


      if (data.status === "ready") {
        statusElement.style.color = "green";
      }
      else if (data.status === "attention") {
        statusElement.style.color = "orange";
      }
      else {
        statusElement.style.color = "red";
      }


      messageElement.textContent =
        data.message;


      document.getElementById("paper").textContent =
        data.paper +
        " / " +
        data.paper_capacity +
        " sheets";


      document.getElementById("toner").textContent =
        data.toner + "%";


      document.getElementById("queue").textContent =
        data.queue + " jobs";


      paperLevelElement.textContent =
        data.paper_level.toUpperCase();


      tonerLevelElement.textContent =
        data.toner_level.toUpperCase();


      applyLevelStyle(
        paperLevelElement,
        data.paper_level
      );


      applyLevelStyle(
        tonerLevelElement,
        data.toner_level
      );


      eventElement.textContent =
        data.last_event;


      eventElement.className =
        "event " + data.last_event_type;


      renderJobs(data.jobs);
    }


    async function loadPrinterStatus() {

      try {

        const response =
          await fetch("/status");

        const data =
          await response.json();

        updatePage(data);

      }

      catch (error) {

        const statusElement =
          document.getElementById("status");

        const messageElement =
          document.getElementById("message");

        statusElement.textContent =
          "● UNREACHABLE";

        statusElement.style.color =
          "red";

        messageElement.textContent =
          "Unable to contact PRNT01.";
      }
    }


    async function runAction(path) {

      try {

        const response =
          await fetch(path);

        const data =
          await response.json();

        updatePage(data);

      }

      catch (error) {

        const eventElement =
          document.getElementById("event");

        eventElement.textContent =
          "Unable to communicate with PRNT01.";

        eventElement.className =
          "event error";
      }
    }


    loadPrinterStatus();

    setInterval(
      loadPrinterStatus,
      3000
    );

  </script>

</body>
</html>
