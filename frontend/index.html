<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive operations console for the NetOps Lab small-office infrastructure.">
  <title>NetOps Lab · Operations Console</title>
    <link rel="stylesheet" href="styles.css?v=device-status-lists">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">N</span>
        <div><strong>NetOps Lab</strong><small>Operations Console</small></div>
      </div>
      <nav aria-label="Primary navigation">
        <button class="nav-item active" data-page="dashboard"><span aria-hidden="true">▦</span>Dashboard</button>
        <button class="nav-item" data-page="network"><span aria-hidden="true">⌘</span>Network</button>
        <button class="nav-item" data-page="systems"><span aria-hidden="true">▤</span>Systems</button>
        <button class="nav-item" data-page="active-directory"><span aria-hidden="true">♙</span>Active Directory</button>
        <button class="nav-item" data-page="monitoring"><span aria-hidden="true">◉</span>Monitoring</button>
        <button class="nav-item" data-page="tickets"><span aria-hidden="true">◇</span>Tickets</button>
        <button class="nav-item" data-page="automation"><span aria-hidden="true">↻</span>Automation</button>
        <button class="nav-item" data-page="architecture"><span aria-hidden="true">⬡</span>Architecture</button>
      </nav>
      <div class="sidebar-footer">
        <div id="backendIndicator" class="backend-indicator checking"><i></i><span>Checking backend</span></div>
        <small>OFFICE01 · Local lab</small>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button id="menuButton" class="menu-button" type="button" aria-label="Toggle navigation">☰</button>
        <div><p class="eyebrow">SMALL OFFICE INFRASTRUCTURE</p><h1 id="pageTitle">Dashboard</h1></div>
        <div class="topbar-actions">
          <span id="lastUpdated" class="last-updated">Waiting for live data</span>
          <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh data">↻</button>
        </div>
      </header>

      <div id="backendBanner" class="backend-banner" role="alert" hidden>
        <div><strong>Backend unavailable</strong><span id="backendMessage">Live lab data could not be loaded.</span></div>
        <button id="retryButton" type="button">Retry</button>
      </div>

      <main id="pageContent" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="deviceDrawer" class="device-drawer" aria-hidden="true" aria-label="Device details">
    <div class="drawer-toolbar">
      <span>Device details</span>
      <button id="closeDrawer" type="button" aria-label="Close device details">×</button>
    </div>
    <div id="drawerContent"></div>
  </aside>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    <script type="module" src="app.js?v=device-status-lists"></script>
</body>
</html>
