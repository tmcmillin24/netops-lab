name: netops

topology:
  nodes:
    rtr01:
      kind: linux
      image: netops-network:phase7
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.10.254.1/30 dev eth1
        - ip route add 10.10.10.0/24 via 10.10.254.2 dev eth1
        - ip route add 10.10.20.0/24 via 10.10.254.2 dev eth1
        - ip route add 10.10.30.0/24 via 10.10.254.2 dev eth1
        - ip route add 10.10.40.0/24 via 10.10.254.2 dev eth1

    core01:
      kind: linux
      image: netops-network:phase7
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.10.254.2/30 dev eth1
        - ip addr add 10.10.10.1/24 dev eth2
        - ip addr add 10.10.20.1/24 dev eth3
        - ip addr add 10.10.30.1/24 dev eth4
        - ip link add br-services type bridge
        - ip link set br-services up
        - ip link set eth5 master br-services
        - ip link set eth6 master br-services
        - ip addr add 10.10.40.1/24 dev br-services
        - iptables -F FORWARD
        - iptables -P FORWARD DROP
        - iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        - iptables -A FORWARD -s 10.10.10.0/24 -d 10.10.254.1/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.20.0/24 -d 10.10.254.1/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.30.0/24 -d 10.10.254.1/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.10.0/24 -d 10.10.40.10/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.20.0/24 -d 10.10.40.10/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.30.0/24 -d 10.10.40.10/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.10.0/24 -d 10.10.40.20/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.20.0/24 -d 10.10.40.20/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.30.0/24 -d 10.10.40.20/32 -j ACCEPT
        - iptables -A FORWARD -s 10.10.40.0/24 -d 10.10.254.1/32 -j ACCEPT

    dc01:
      kind: linux
      image: netops-dc01:phase8
      privileged: false
      cap-add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
      binds:
        - ${DC01_STATE_DIR}/config:/etc/samba
        - ${DC01_STATE_DIR}/data:/var/lib/samba
      exec:
        - ip addr add 10.10.40.10/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.40.1 dev eth1

    file01:
      kind: linux
      image: netops-file01:phase9
      cap-add:
        - NET_ADMIN
        - NET_RAW
      binds:
        - ${FILE01_STATE_DIR}/shares:/srv/shares
      exec:
        - ip addr add 10.10.40.20/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.40.1 dev eth1

    sw01:
      kind: linux
      image: netops-network:phase7
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - sh -c 'for iface in /sys/class/net/eth[1-9]*; do ip link set "$(basename "$iface")" master br0; done'
        - ip addr add 10.10.10.2/24 dev br0
        - ip route add 10.10.0.0/16 via 10.10.10.1 dev br0

    sw02:
      kind: linux
      image: netops-network:phase7
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - sh -c 'for iface in /sys/class/net/eth[1-9]*; do ip link set "$(basename "$iface")" master br0; done'
        - ip addr add 10.10.20.2/24 dev br0
        - ip route add 10.10.0.0/16 via 10.10.20.1 dev br0

    sw03:
      kind: linux
      image: netops-network:phase7
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - sh -c 'for iface in /sys/class/net/eth[1-9]*; do ip link set "$(basename "$iface")" master br0; done'
        - ip addr add 10.10.30.2/24 dev br0
        - ip route add 10.10.0.0/16 via 10.10.30.1 dev br0

    ws01:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS01
      ports:
        - "8081:8081"
      exec:
        - ip addr add 10.10.10.11/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.10.1 dev eth1

    ws02:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS02
      exec:
        - ip addr add 10.10.10.12/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.10.1 dev eth1

    ws03:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS03
      exec:
        - ip addr add 10.10.10.13/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.10.1 dev eth1

    ws04:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS04
      exec:
        - ip addr add 10.10.20.11/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.20.1 dev eth1

    ws05:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS05
      exec:
        - ip addr add 10.10.20.12/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.20.1 dev eth1

    ws06:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS06
      exec:
        - ip addr add 10.10.20.13/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.20.1 dev eth1

    ws07:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS07
      exec:
        - ip addr add 10.10.30.11/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.30.1 dev eth1

    ws08:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS08
      exec:
        - ip addr add 10.10.30.12/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.30.1 dev eth1

    ws09:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: WS09
      exec:
        - ip addr add 10.10.30.13/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.30.1 dev eth1

    ltp01:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: LTP01
      exec:
        - ip addr add 10.10.10.14/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.10.1 dev eth1

    ltp02:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: LTP02
      exec:
        - ip addr add 10.10.10.15/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.10.1 dev eth1

    ltp03:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: LTP03
      exec:
        - ip addr add 10.10.20.14/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.20.1 dev eth1

    ltp04:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: LTP04
      exec:
        - ip addr add 10.10.20.15/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.20.1 dev eth1

    ltp05:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: LTP05
      exec:
        - ip addr add 10.10.30.14/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.30.1 dev eth1

    ltp06:
      kind: linux
      image: netops-workstation:phase3
      env:
        DEVICE_NAME: LTP06
      exec:
        - ip addr add 10.10.30.15/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.30.1 dev eth1

    # DYNAMIC_WORKSTATION_NODES

    prnt01:
      kind: linux
      image: netops-printer:phase3
      env:
        DEVICE_NAME: PRNT01
      ports:
        - "8080:8080"
      exec:
        - ip addr add 10.10.10.21/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.10.1 dev eth1

    prnt02:
      kind: linux
      image: netops-printer:phase3
      env:
        DEVICE_NAME: PRNT02
      ports:
        - "8082:8080"
      exec:
        - ip addr add 10.10.20.21/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.20.1 dev eth1

    prnt03:
      kind: linux
      image: netops-printer:phase3
      env:
        DEVICE_NAME: PRNT03
      ports:
        - "8083:8080"
      exec:
        - ip addr add 10.10.30.21/24 dev eth1
        - ip route add 10.10.0.0/16 via 10.10.30.1 dev eth1

  links:
    - endpoints: ["rtr01:eth1", "core01:eth1"]
    - endpoints: ["core01:eth2", "sw01:eth1"]
    - endpoints: ["core01:eth3", "sw02:eth1"]
    - endpoints: ["core01:eth4", "sw03:eth1"]
    - endpoints: ["core01:eth5", "dc01:eth1"]
    - endpoints: ["core01:eth6", "file01:eth1"]
    - endpoints: ["sw01:eth2", "ws01:eth1"]
    - endpoints: ["sw01:eth3", "ws02:eth1"]
    - endpoints: ["sw01:eth4", "ws03:eth1"]
    - endpoints: ["sw01:eth5", "prnt01:eth1"]
    - endpoints: ["sw01:eth6", "ltp01:eth1"]
    - endpoints: ["sw01:eth7", "ltp02:eth1"]
    - endpoints: ["sw02:eth2", "ws04:eth1"]
    - endpoints: ["sw02:eth3", "ws05:eth1"]
    - endpoints: ["sw02:eth4", "ws06:eth1"]
    - endpoints: ["sw02:eth5", "prnt02:eth1"]
    - endpoints: ["sw02:eth6", "ltp03:eth1"]
    - endpoints: ["sw02:eth7", "ltp04:eth1"]
    - endpoints: ["sw03:eth2", "ws07:eth1"]
    - endpoints: ["sw03:eth3", "ws08:eth1"]
    - endpoints: ["sw03:eth4", "ws09:eth1"]
    - endpoints: ["sw03:eth5", "prnt03:eth1"]
    - endpoints: ["sw03:eth6", "ltp05:eth1"]
    - endpoints: ["sw03:eth7", "ltp06:eth1"]
    # DYNAMIC_WORKSTATION_LINKS
